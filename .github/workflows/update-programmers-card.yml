name: Update Programmers card

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: programmers-card

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Update card from Programmers
        env:
          PROGRAMMERS_TOKEN_ID: ${{ secrets.PROGRAMMERS_TOKEN_ID }}
          PROGRAMMERS_TOKEN_PW: ${{ secrets.PROGRAMMERS_TOKEN_PW }}
        run: python3 .github/scripts/update_programmers.py

      - name: Publish changed card
        run: |
          if git diff --quiet -- assets/programmers.svg; then
            echo "Profile card is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/programmers.svg
          git commit -m "Update Programmers coding activity"
          git pull --rebase origin main
          git push origin HEAD:main
