name: Update language activity card

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Fetch and recolor activity card
        run: |
          curl --fail --silent --show-error --location \
            "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=kimjuneon&theme=github_dark" \
            --output assets/most-commit-language.svg
          sed -i \
            -e 's/#0366d6/#2DD4BF/g' \
            -e 's/#77909c/#94A3B8/g' \
            -e 's/#2e343b/#334155/g' \
            -e 's/#b07219/#2DD4BF/g' \
            -e 's/#f1e05a/#60A5FA/g' \
            -e 's/#e34c26/#A78BFA/g' \
            assets/most-commit-language.svg

      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/most-commit-language.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/most-commit-language.svg
          git commit -m "chore: update language activity card"
          git push
